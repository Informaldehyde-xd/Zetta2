name: Build launcher

on:
  workflow_dispatch:
    inputs:
      keep_symbols:
        description: "Keep symbols in libzbridge.so"
        type: boolean
        default: false

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 29.0.14206865
  DYNARMIC_URL: https://github.com/Vita3K/dynarmic
  DYNARMIC_COMMIT: 86458a0bd369d63ba4c2ef812cacbb6c9080c065

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # THIS IS THE MAGIC: It runs the job twice in parallel
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make the repo's scripts executable
        run: |
          set -eu
          chmod +x tools/*.sh tools/*.py android/launcher/gradlew
          ls -l tools | head -30

      - name: Make sure Dynarmic is present
        run: |
          set -eu
          if [ ! -f third_party/dynarmic/CMakeLists.txt ]; then
            rm -rf third_party/dynarmic
            git clone --recursive "$DYNARMIC_URL" third_party/dynarmic
            git -C third_party/dynarmic checkout "$DYNARMIC_COMMIT"
            git -C third_party/dynarmic submodule update --init --recursive
          fi
          git -C third_party/dynarmic log -1 --format='dynarmic at %H'

      - name: Apply the repo's Dynarmic patches
        run: |
          set -eu
          cd third_party/dynarmic
          for patch in ../patches/dynarmic-0001-thumb32-armv8.patch ../patches/dynarmic-0002-asimd-narrowing.patch; do
            if git apply --check "$patch" 2>/dev/null; then
              git apply "$patch"
            elif git apply -R --check "$patch" 2>/dev/null; then
              echo "already applied: $patch"
            else
              echo "cannot apply $patch" >&2; exit 1
            fi
          done

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev ninja-build ccache e2fsprogs unzip curl python3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK r29 and SDK pieces
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;34.0.0"
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore the arm32 sysroot cache
        id: sysroot-cache
        uses: actions/cache@v4
        with:
          path: sysroot
          key: sysroot-${{ hashFiles('tools/extract_sysroot.sh') }}

      - name: Extract the arm32 sysroot from the AOSP GSI
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          if [ -f sysroot-prebuilt.tar.xz ]; then
            tar -xJf sysroot-prebuilt.tar.xz
          else
            tools/extract_sysroot.sh
            rm -rf .cache/gsi
          fi
          ls -l sysroot/system/bin sysroot/system/lib

      - name: Build the arm32 guest pieces
        run: |
          set -eu
          export NDK_HOST=linux-x86_64
          tools/build_guest.sh

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-android-arm64-${{ matrix.build_type }}

      - name: Prepare the release key (optional)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p "$HOME/.zettabridge"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.zettabridge/release.jks"
            {
              echo "storeFile=$HOME/.zettabridge/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$HOME/.zettabridge/signing.properties"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build C++ (${{ matrix.build_type }})
        run: |
          set -eu
          mkdir -p build/boost-headers
          ln -sfn /usr/include/boost build/boost-headers/boost
          
          # For Release builds, reduce parallel jobs to prevent OOM crash with -flto
          PARALLEL_JOBS=2
          if [ "${{ matrix.build_type }}" = "Release" ]; then
            PARALLEL_JOBS=1
          fi

          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DZB_BUILD_TESTS=OFF \
            -DBoost_INCLUDE_DIR="$PWD/build/boost-headers" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          
          ninja -C build/android-arm64 -j${PARALLEL_JOBS} zbridge zbproxy

      - name: Pack Launcher
        run: tools/make_launcher_bundle.sh

      - name: Build Launcher APK (${{ matrix.build_type }})
        working-directory: android/launcher
        run: |
          set -eu
          chmod +x ./gradlew
          mkdir -p ../../out
          
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/*.apk ../../out/ZettaBridge-Debug.apk
          else
            ./gradlew --no-daemon assembleRelease
            if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
              cp app/build/outputs/apk/release/*.apk ../../out/ZettaBridge-Stock.apk
            else
              cp app/build/outputs/apk/release/*.apk ../../out/ZettaBridge-Stock-UNSIGNED.apk
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZettaBridge-${{ matrix.build_type }}-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Upload libzbridge.so with symbols
        if: ${{ inputs.keep_symbols }}
        uses: actions/upload-artifact@v4
        with:
          name: libzbridge-symbols-${{ matrix.build_type }}-${{ github.run_number }}
          path: build/android-arm64/core/libzbridge.so
          retention-days: 14
